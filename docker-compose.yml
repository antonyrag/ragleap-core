services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ragleap_core_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragleap
      POSTGRES_PASSWORD: ragleap
      POSTGRES_DB: ragleap_core
    ports:
      - "5433:5432"
    volumes:
      - ragleap_core_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragleap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ragleap_core_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ragleap:ragleap@db:5432/ragleap_core
    ports:
      - "8000:8000"

volumes:
  ragleap_core_data:
