services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragleap
      POSTGRES_PASSWORD: ragleap
      POSTGRES_DB: ragleap_core
    ports:
      - "5433:5432"
    volumes:
      - ragleap_core_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragleap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ragleap:ragleap@db:5432/ragleap_core
    extra_hosts:
      # Lets the container reach services on the host (e.g. a local Ollama
      # instance) via host.docker.internal, matching Docker Desktop's
      # built-in behavior which plain Linux Docker Engine doesn't have
      # by default. Requires Docker Engine >=20.10.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  voice:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ragleap:ragleap@db:5432/ragleap_core
    ports:
      - "8766:8765"
    command: ["python3", "-m", "channels.voice.server"]

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/ragleapgraph
      NEO4J_PLUGINS: '[]'
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - ragleap_core_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ragleap_core_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ragleap:ragleap@db:5432/ragleap_core
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    # Scale horizontally with: docker compose up -d --scale worker=3
    # (only useful once REDIS_URL is set in .env - the app runs work
    # inline otherwise, and this container just idles waiting for jobs)

volumes:
  ragleap_core_data:
  ragleap_core_neo4j_data:
  ragleap_core_redis_data:
