[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-integrations"
version = "0.1.0"
description = "MCP client that turns allowlisted tools on remote MCP servers into ragleap-tools Tool objects. Streamable HTTP only, standard library plus ragleap-tools, owner-configured allowlist, pinned and bounded network access. BYOK, no vendor lock-in."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Antony", email = "antony@ragleap.com" }
]
keywords = ["mcp", "model-context-protocol", "llm", "tool-calling", "agents", "integrations", "self-hosted", "byok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["ragleap-tools>=0.4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/antonyrag/ragleap-core"
Repository = "https://github.com/antonyrag/ragleap-core"
Documentation = "https://github.com/antonyrag/ragleap-core/tree/main/packages/ragleap-integrations"
Issues = "https://github.com/antonyrag/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_integrations"]
