[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-app-chart"
version = "0.2.1"
description = "Generic, reusable Helm chart for deploying arbitrary services to Kubernetes — not RagLeap-specific"
readme = "README.md"
keywords = ["helm", "helm-chart", "kubernetes", "k8s", "devops", "generic-chart", "deployment", "ingress", "autoscaling", "microservices"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RagLeap Contributors" }
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://packages.ragleap.com/docs/ragleap-app-chart.html"
Documentation = "https://packages.ragleap.com/docs/ragleap-app-chart.html"
Source = "https://github.com/antonyrag/ragleap-core/tree/main/packages/ragleap-app-chart"
Changelog = "https://github.com/antonyrag/ragleap-core/blob/main/packages/ragleap-app-chart/CHANGELOG.md"
Issues = "https://github.com/antonyrag/ragleap-core/issues"

[tool.hatchling.build.targets.wheel]
packages = ["src/ragleap_app_chart"]
