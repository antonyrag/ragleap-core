apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-app
  labels:
    app: ragleap-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragleap-app
  template:
    metadata:
      labels:
        app: ragleap-app
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h ragleap-db -p 5432 -U ragleap; do sleep 2; done"]
      containers:
        - name: app
          image: ghcr.io/antonyrag/ragleap-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ragleap-app-env
          env:
            - name: DATABASE_URL
              value: "postgresql://ragleap:ragleap@ragleap-db:5432/ragleap_core"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
