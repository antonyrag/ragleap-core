apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-neo4j
  namespace: ragleap-core
  labels:
    app: ragleap-neo4j
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragleap-neo4j
  template:
    metadata:
      labels:
        app: ragleap-neo4j
    spec:
      securityContext:
        fsGroup: 7474
      serviceAccountName: ragleap-neo4j
      automountServiceAccountToken: false
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      containers:
        - name: neo4j
          image: neo4j:5-community
          securityContext:
            runAsNonRoot: true
            runAsUser: 7474
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem intentionally NOT enabled yet --
            # this container may write outside its declared volume
            # mounts (e.g. /tmp, /var/run) and this has not been
            # live-tested. Enabling it blind risks breaking startup.
          envFrom:
            - secretRef:
                name: ragleap-neo4j-secret
          env:
            - name: NEO4J_PLUGINS
              value: "[]"
          ports:
            - containerPort: 7474
            - containerPort: 7687
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: ragleap-neo4j-data
