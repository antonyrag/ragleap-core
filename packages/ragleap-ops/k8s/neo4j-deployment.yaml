apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-neo4j
  namespace: ragleap-core
  labels:
    app: ragleap-neo4j
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragleap-neo4j
  template:
    metadata:
      labels:
        app: ragleap-neo4j
    spec:
      securityContext:
        fsGroup: 7474
      serviceAccountName: ragleap-neo4j
      automountServiceAccountToken: false
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      containers:
        - name: neo4j
          image: neo4j:5-community
          securityContext:
            runAsNonRoot: true
            runAsUser: 7474
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem CONFIRMED UNSAFE for this service,
            # live-tested on a real kind cluster (not just speculated):
            # mounting /var/lib/neo4j/conf as a writable emptyDir (required
            # since the entrypoint rewrites this dir on every container
            # restart, confirmed via file mtime vs container finishedAt)
            # SHADOWS the image's real baked-in default config, silently
            # dropping it from 350 real lines to ~5. Real losses included
            # server.directories.import=import (a security boundary
            # restricting LOAD CSV to Neo4j's own import/ dir) and ~17 JVM
            # tuning/TLS-hardening flags. The pod still reached Running and
            # answered basic Cypher queries -- this would NOT have been
            # caught without deliberately diffing the real conf file
            # against the image's shipped default. Do not enable this flag
            # for neo4j without first solving the conf-shadowing problem
            # (e.g. a ConfigMap seeded from the image's real defaults, not
            # an empty emptyDir).
          envFrom:
            - secretRef:
                name: ragleap-neo4j-secret
          env:
            - name: NEO4J_PLUGINS
              value: "[]"
          ports:
            - containerPort: 7474
            - containerPort: 7687
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
            - name: neo4j-run
              mountPath: /var/lib/neo4j/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: ragleap-neo4j-data
        - name: neo4j-logs
          emptyDir: {}
        - name: neo4j-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
