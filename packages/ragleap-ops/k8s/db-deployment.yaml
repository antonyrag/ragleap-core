apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-db
  labels:
    app: ragleap-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragleap-db
  template:
    metadata:
      labels:
        app: ragleap-db
    spec:
      containers:
        - name: db
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef:
                name: ragleap-db-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: db-schema
              mountPath: /docker-entrypoint-initdb.d/01-schema.sql
              subPath: schema.sql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ragleap"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ragleap"]
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: ragleap-db-data
        - name: db-schema
          configMap:
            name: ragleap-db-schema
