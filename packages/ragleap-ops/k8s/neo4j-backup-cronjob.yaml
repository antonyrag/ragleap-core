apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragleap-neo4j-backup
  namespace: ragleap-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ragleap-neo4j-backup-role
  namespace: ragleap-core
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["ragleap-neo4j"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ragleap-neo4j-backup-binding
  namespace: ragleap-core
subjects:
  - kind: ServiceAccount
    name: ragleap-neo4j-backup
roleRef:
  kind: Role
  name: ragleap-neo4j-backup-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ragleap-neo4j-backup
  namespace: ragleap-core
spec:
  schedule: "0 3 * * *"   # matches db backup schedule; adjust to your real RPO needs
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: ragleap-neo4j-backup
          restartPolicy: OnFailure
          initContainers:
            - name: scale-down
              image: alpine/kubectl:1.34.2
              command:
                - sh
                - -c
                - |
                  set -e
                  kubectl scale deployment ragleap-neo4j --replicas=0
                  kubectl wait --for=delete pod -l app=ragleap-neo4j --timeout=120s
            # Native sidecar (restartPolicy: Always, stable since k8s 1.29).
            # Starts alongside the dump container below and is only
            # terminated after it finishes -- success OR failure. This
            # closes a real gap found in this session's live testing: the
            # scale-down step had no guaranteed scale-back-up, so a failed
            # or interrupted dump could leave neo4j at 0 replicas
            # indefinitely with nothing to notice or recover. The dump
            # container always writes a signal file via `trap ... EXIT`
            # (fires on both success and failure), and this sidecar waits
            # for that signal before scaling back up, then exits itself.
            - name: scale-up-watcher
              image: alpine/kubectl:1.34.2
              restartPolicy: Always
              command:
                - sh
                - -c
                - |
                  set -e
                  echo "Waiting for backup completion signal..."
                  while [ ! -f /signal/backup-done ]; do
                    sleep 2
                  done
                  echo "Signal received -- scaling ragleap-neo4j back up."
                  kubectl scale deployment ragleap-neo4j --replicas=1
                  echo "Scale-up complete."
              volumeMounts:
                - name: signal
                  mountPath: /signal
          containers:
            - name: dump
              image: neo4j:5-community
              command:
                - sh
                - -c
                - |
                  set -e
                  trap 'touch /signal/backup-done' EXIT
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  mkdir -p /backups/neo4j-${TIMESTAMP}
                  neo4j-admin database dump neo4j --to-path=/backups/neo4j-${TIMESTAMP}
                  echo "Backup written: neo4j-${TIMESTAMP}"
              volumeMounts:
                - name: neo4j-data
                  mountPath: /data
                - name: backup-data
                  mountPath: /backups
                - name: signal
                  mountPath: /signal
          volumes:
            - name: neo4j-data
              persistentVolumeClaim:
                claimName: ragleap-neo4j-data
            - name: backup-data
              persistentVolumeClaim:
                claimName: ragleap-backup-data
            - name: signal
              emptyDir: {}
