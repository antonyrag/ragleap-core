# Read-only monitoring credentials for ragleap-observability's
# postgres_exporter. Consumes the ragleap_monitor role created in
# db-schema-configmap.yaml (pg_monitor built-in role, stats views only,
# no table data access).
#
# NOTE: ragleap-observability must be deployed into this same
# ragleap-core namespace to reference this secret -- deploying it into
# a different namespace (e.g. via a bare `helm install` with no
# --namespace flag) will not find it, exactly as observed in this
# session's first live test.
apiVersion: v1
kind: Secret
metadata:
  name: ragleap-db-exporter-secret
  namespace: ragleap-core
type: Opaque
stringData:
  connection-string: "postgresql://ragleap_monitor:ragleap_monitor_password@ragleap-db:5432/ragleap_core?sslmode=disable"
