apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-voice
  labels:
    app: ragleap-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragleap-voice
  template:
    metadata:
      labels:
        app: ragleap-voice
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h ragleap-db -p 5432 -U ragleap; do sleep 2; done"]
      containers:
        - name: voice
          image: ghcr.io/antonyrag/ragleap-app:latest
          command: ["python3", "-m", "channels.voice.server"]
          ports:
            - containerPort: 8765
          envFrom:
            - secretRef:
                name: ragleap-app-env
          env:
            - name: DATABASE_URL
              value: "postgresql://ragleap:ragleap@ragleap-db:5432/ragleap_core"
