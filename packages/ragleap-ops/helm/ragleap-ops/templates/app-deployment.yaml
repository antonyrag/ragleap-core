apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-app
  labels:
    app: ragleap-app
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: ragleap-app
  template:
    metadata:
      labels:
        app: ragleap-app
    spec:
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: ragleap-app
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.app.imagePullSecret }}
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h ragleap-db -p 5432 -U {{ .Values.db.credentials.user }}; do sleep 2; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
      containers:
        - name: app
          image: {{ .Values.app.image }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.app.port }}
          envFrom:
            - secretRef:
                name: ragleap-app-env
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.db.credentials.user }}:{{ .Values.db.credentials.password }}@ragleap-db:5432/{{ .Values.db.credentials.database }}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.probes.readiness.initialDelaySeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.probes.liveness.initialDelaySeconds }}
      volumes:
        - name: tmp
          emptyDir: {}
