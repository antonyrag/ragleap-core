{{- if .Values.serviceAccount.create }}
{{- range $name := list "app" "voice" "db" "neo4j" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragleap-{{ $name }}
  labels:
    {{- include "ragleap-ops.labels" $ | nindent 4 }}
# Zero-permission by design: none of these services call the Kubernetes
# API, so there is no Role/RoleBinding, and Deployments set
# automountServiceAccountToken: false so no token is mounted at all.
automountServiceAccountToken: false
{{- end }}
{{- end }}
