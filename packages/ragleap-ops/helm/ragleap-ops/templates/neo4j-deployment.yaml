apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-neo4j
  labels:
    app: ragleap-neo4j
spec:
  replicas: 1  # intentionally not configurable - stateful, single-writer, ReadWriteOnce PVC
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ragleap-neo4j
  template:
    metadata:
      labels:
        app: ragleap-neo4j
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 7474:7474 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 7474
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem intentionally NOT enabled --
            # /logs, /var/lib/neo4j/run, /tmp are now writable emptyDirs,
            # but the Neo4j Docker entrypoint rewrites /var/lib/neo4j/conf
            # on every startup, which has NOT been verified to tolerate
            # a read-only root. Needs investigation before enabling.
          envFrom:
            - secretRef:
                name: ragleap-neo4j-secret
          env:
            - name: NEO4J_PLUGINS
              value: {{ .Values.neo4j.plugins | quote }}
          ports:
            - containerPort: {{ .Values.neo4j.ports.http }}
            - containerPort: {{ .Values.neo4j.ports.bolt }}
          resources:
            requests:
              memory: {{ .Values.neo4j.resources.requests.memory }}
              cpu: {{ .Values.neo4j.resources.requests.cpu }}
            limits:
              memory: {{ .Values.neo4j.resources.limits.memory }}
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
            - name: neo4j-run
              mountPath: /var/lib/neo4j/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.neo4j.ports.http }}
            initialDelaySeconds: {{ .Values.neo4j.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.neo4j.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.neo4j.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.neo4j.ports.http }}
            initialDelaySeconds: {{ .Values.neo4j.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.neo4j.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.neo4j.probes.liveness.failureThreshold }}
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: ragleap-neo4j-data
        - name: neo4j-logs
          emptyDir: {}
        - name: neo4j-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
