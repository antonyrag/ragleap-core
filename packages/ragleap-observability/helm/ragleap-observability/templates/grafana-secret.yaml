{{- if and .Values.grafana.enabled (not .Values.grafana.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: ragleap-grafana-admin
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.admin.user | quote }}
  # Empty password falls back to a well-known placeholder. Set
  # grafana.admin.password, or better, grafana.admin.existingSecret.
  admin-password: {{ .Values.grafana.admin.password | default "change-me-before-real-use" | quote }}
{{- end }}
