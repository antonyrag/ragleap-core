{{- if .Values.alertmanager.enabled }}
{{- $slack := .Values.alertmanager.receivers.slack }}
{{- $email := .Values.alertmanager.receivers.email }}
{{- $any := or $slack.enabled $email.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragleap-alertmanager-config
data:
  alertmanager.yml: |
    {{- if $email.enabled }}
    global:
      smtp_smarthost: {{ required "alertmanager.receivers.email.smarthost is required when email is enabled" $email.smarthost | quote }}
      smtp_from: {{ required "alertmanager.receivers.email.from is required when email is enabled" $email.from | quote }}
      smtp_auth_username: {{ required "alertmanager.receivers.email.username is required when email is enabled" $email.username | quote }}
      smtp_auth_password_file: /etc/alertmanager-secrets/{{ $email.secretKey }}
    {{- end }}
    route:
      receiver: {{ if $any }}team{{ else }}default-webhook{{ end }}
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
    {{- if $any }}
      - name: team
    {{- if $slack.enabled }}
        slack_configs:
          - api_url_file: /etc/alertmanager-secrets/{{ $slack.secretKey }}
            channel: {{ $slack.channel | quote }}
            send_resolved: true
    {{- end }}
    {{- if $email.enabled }}
        email_configs:
          - to: {{ required "alertmanager.receivers.email.to is required when email is enabled" $email.to | quote }}
            send_resolved: true
    {{- end }}
    {{- else }}
      - name: default-webhook
        # PLACEHOLDER -- enable alertmanager.receivers.slack and/or
        # .email in values.yaml. As configured, every send fails; alerts
        # are still routed, grouped and visible in AlertManager's UI/API.
        webhook_configs:
          - url: 'http://localhost:1/replace-with-real-receiver'
            send_resolved: true
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragleap-alertmanager
  labels:
    app: ragleap-alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragleap-alertmanager
  template:
    metadata:
      labels:
        app: ragleap-alertmanager
      annotations:
        checksum/config: {{ toYaml .Values.alertmanager | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: ragleap-alertmanager
      {{- end }}
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
            {{- if $any }}
            - name: secrets
              mountPath: /etc/alertmanager-secrets
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: ragleap-alertmanager-config
        - name: data
          # emptyDir, not a PVC -- silence/notification state loss on
          # pod restart is an accepted, documented limitation.
          emptyDir: {}
        {{- if $any }}
        - name: secrets
          secret:
            secretName: {{ .Values.alertmanager.receivers.secretName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ragleap-alertmanager
  labels:
    app: ragleap-alertmanager
spec:
  selector:
    app: ragleap-alertmanager
  ports:
    - port: 9093
      targetPort: 9093
{{- end }}
