{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: ragleap-observability-agents
  labels:
    # Deliberately NOT baseline/restricted -- Promtail structurally
    # needs hostPath to read node-level container logs, which baseline
    # PodSecurityStandards forbids. Isolated into its own namespace
    # rather than relaxing ragleap-core's namespace-wide PSS guarantee
    # for every other workload, per the standard pattern of isolating
    # host-level log/metrics collectors from application namespaces.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragleap-promtail-config
  namespace: ragleap-observability-agents
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      log_level: debug
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://ragleap-loki.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.loki.port }}/loki/api/v1/push
    # DIAGNOSTIC: static file scrape, no kubernetes_sd_configs at all.
    # The kubernetes_sd-based config above (now disabled) consistently
    # showed 0/0 active targets despite: RBAC confirmed correct via
    # `kubectl auth can-i`, the discovery provider confirmed starting
    # in debug logs, and two different __path__ patterns tried and
    # confirmed correct against real `ls /var/log/pods/` output. This
    # static config isolates whether the problem is in the
    # kubernetes_sd/relabel pipeline specifically, or something more
    # fundamental like the hostPath mount itself.
    scrape_configs:
      - job_name: static-pod-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: static-pod-logs
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          - cri: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragleap-promtail
  namespace: ragleap-observability-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ragleap-promtail-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ragleap-promtail-binding
subjects:
  - kind: ServiceAccount
    name: ragleap-promtail
    namespace: ragleap-observability-agents
roleRef:
  kind: ClusterRole
  name: ragleap-promtail-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ragleap-promtail
  namespace: ragleap-observability-agents
  labels:
    app: ragleap-promtail
spec:
  selector:
    matchLabels:
      app: ragleap-promtail
  template:
    metadata:
      labels:
        app: ragleap-promtail
    spec:
      serviceAccountName: ragleap-promtail
      # Promtail genuinely needs root -- confirmed via `docker run
      # --entrypoint sh grafana/promtail:3.3.0 -c id` (uid=0), not
      # assumed. It reads node-level container log files from
      # /var/log/pods, which requires elevated host access -- this is
      # a structural requirement of what a log-shipping DaemonSet
      # does, not a bug to force non-root on.
      containers:
        - name: promtail
          image: {{ .Values.promtail.image }}
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: ragleap-promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
{{- end }}
