{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: ragleap-observability-agents
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragleap-promtail-config
  namespace: ragleap-observability-agents
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      log_level: info
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://ragleap-loki.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.loki.port }}/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragleap-promtail
  namespace: ragleap-observability-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ragleap-promtail-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ragleap-promtail-binding
subjects:
  - kind: ServiceAccount
    name: ragleap-promtail
    namespace: ragleap-observability-agents
roleRef:
  kind: ClusterRole
  name: ragleap-promtail-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ragleap-promtail
  namespace: ragleap-observability-agents
  labels:
    app: ragleap-promtail
spec:
  selector:
    matchLabels:
      app: ragleap-promtail
  template:
    metadata:
      labels:
        app: ragleap-promtail
    spec:
      serviceAccountName: ragleap-promtail
      containers:
        - name: promtail
          image: {{ .Values.promtail.image }}
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: ragleap-promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
{{- end }}
