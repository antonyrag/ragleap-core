{{- if .Values.serviceAccount.create }}
{{- range $name := list "prometheus" "grafana" "loki" "alertmanager" "postgres-exporter" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragleap-{{ $name }}
# Zero-permission by design: none of these workloads call the Kubernetes
# API (Prometheus uses static targets here), so no Role/RoleBinding and
# no token is mounted. Promtail has its own ServiceAccount + ClusterRole.
automountServiceAccountToken: false
{{- end }}
{{- end }}
