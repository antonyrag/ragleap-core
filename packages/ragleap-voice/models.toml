# Model manifest. One [[model]] per downloadable artifact.
# Rules (enforced by tests/test_licences.py):
#  - default = true requires status = "verified", a pinned revision, a 64-hex sha256,
#    and code_license / weights_license both on the allowlist.
#  - Everything below is a LEAD from the 2026-10-10 research, NOT verified.
#    Do not set status = "verified" until licence, languages and hash are checked at the source.

[[model]]
name = "whisper-large-v3"
kind = "stt"
source_url = "https://huggingface.co/Systran/faster-whisper-large-v3"
revision = "edaa852ec7e145841d8ffdb056a99866b5f0a478"
sha256 = "f6d63135670f94974bb20c80aff3156e1d4adfee83ec9f2562d4efbff11f135a"
code_license = "MIT"
weights_license = "MIT"
languages = []
capabilities = ["streaming:unknown"]
min_hardware = "unknown"
status = "unverified"
default = false

