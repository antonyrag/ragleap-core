name: Translate README

# Manual trigger only, deliberately -- translating into 54 languages costs
# real API calls against a free-tier Gemini key, so this runs on demand
# (after a meaningful README.md change) rather than on every push.
on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Translate README into 54 languages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CI }}
        run: python3 scripts/translate_readme.py

      - name: Open PR with translations
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: update README translations"
          title: "docs: update README translations (54 languages)"
          body: |
            Auto-generated by the Translate README workflow (manual
            trigger), translating README.md into all 54 languages
            core/language.py's LanguageDetector supports (langdetect's
            profile set, minus English).

            Please review before merging -- translation quality is not
            spot-checked automatically.
          branch: docs/readme-translations
          delete-branch: true
